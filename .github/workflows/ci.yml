# ADR-011: the APK is built by GitHub Actions on merge, never through a store.
#
# The `master` trigger is deliberate and was decided in ADR-011, not by accident.
# The owner asked for `main`; this repository's default branch is `master`; a
# workflow whose `on:` names a branch that does not exist NEVER RUNS and reports
# success. Q-006 tracks the rename, and the trigger follows it when it happens.
#
# Versioning: `pubspec.yaml`'s `version:` is the single source of truth, and this
# workflow overrides `--build-name` / `--build-number` from the git tag and the
# Actions run number. Two builds of the same commit must never be
# indistinguishable from each other in a bug report.

name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# A new push to the same branch cancels the run in flight. Without this, a series
# of pushes queues every build and the oldest green is reported last.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (format, analyze, test, plan corpus, build)
    runs-on: ubuntu-latest

    steps:
      # JDK 21, deliberately. The Android SDK that ships with Android Studio
      # carries Java 25, and Gradle 8.14 CANNOT RUN ON IT — the failure is a bare
      # `25.0.3` under "What went wrong", which reads like a project fault and is
      # not. Pinned here so the build does not inherit whatever the runner has.
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Pinned rather than `stable`: a Flutter release that changes the
          # template or the Gradle default must arrive as a visible diff in this
          # file, not as a red build nobody can explain.
          flutter-version: '3.47.6'
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      # ---- Gate 1 — format. Cheapest, and it decides merges on its own. -------
      - name: Gate 1 — format
        run: dart format --output=none --set-exit-if-changed .

      # ---- Gate 2 — static analysis -----------------------------------------
      # Zero issues INCLUDING zero info. Weakening a lint to reach green is not
      # a fix (AGENTS.md, Definition of Done item 2).
      - name: Gate 2 — analyze
        run: flutter analyze --fatal-infos

      # ---- Gate 3 — the host suite -------------------------------------------
      # Files under test/ only. `flutter test -d <id>` silently ignores the device
      # flag here, so no `-d` appears in this repository's CI by design.
      - name: Gate 3 — host test suite
        run: flutter test --reporter expanded

      # ---- Gate 4 — the plan corpus -----------------------------------------
      # Recomputes the register's derived counts. No `--test-plan` flag: that is
      # not a mode, `sys.argv[1:]` is a slice-name filter, and passing it matched
      # nothing while printing "no failures".
      - name: Gate 4 — plan corpus and derived counts
        run: python3 .forge/plans/check_plans.py

      # Forge's own guards are NOT run here. `$FORGE/scripts/forge-guard.js` lives
      # in the agent skill directory, which is not vendored into this repository,
      # so a workflow invoking it would fail on a missing path rather than on a
      # real defect. They run locally instead — `tool/dod.sh`, which is the
      # Definition of Done as one command with one verdict.
      #
      # `tool/dod.sh` is NOT wired in here for the same reason: it would exit 2
      # (`INCOMPLETE`) on a runner with no skill directory, which would make every
      # build red for a reason that is not a defect. The four gates above are the
      # part CI can actually run, and they are the part that is automatable.
      #
      # `version_pins_agree`'s false positive (F-005) is fixed upstream as of
      # 2026-10-04, so that caveat is gone.

      # ---- Gate 6 — the APK --------------------------------------------------
      - name: Gate 6 — build the release APK
        run: |
          set -euo pipefail
          # pubspec `version:` is the source of truth; the tag and the run number
          # make two builds of one commit distinguishable.
          BASE=$(grep -E '^version:' pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          BUILD=${{ github.run_number }}
          NAME="${BASE}+${BUILD}"
          echo "Building ${NAME}"
          flutter build apk --release \
            --build-name="$NAME" \
            --build-number="$BUILD"

      - name: Assert the native SQLite library is packaged
        # The failure this catches is invisible in the build log: a `.so` that is
        # packaged but fails to `dlopen` at runtime still produces a successful
        # build. `lib/arm64-v8a/libsqlite3.so` is what the whole database layer
        # rests on (ADR-005 replaced `sqlite3_flutter_libs` with `sqlite3` 3.x,
        # which compiles it through Dart build hooks).
        run: |
          set -euo pipefail
          APK=$(ls build/app/outputs/flutter-apk/*.apk | head -1)
          echo "Inspecting $APK"
          unzip -l "$APK" | grep -q 'lib/arm64-v8a/libsqlite3\.so' \
            || { echo "::error::lib/arm64-v8a/libsqlite3.so is absent from the APK"; exit 1; }
          unzip -l "$APK" | grep 'libsqlite3\.so'

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: lumen-tale-apk-${{ github.sha }}
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 30

  # NOT a CI job, and deliberately so.
  #
  # The on-device suite (`flutter test integration_test -d <id>`) needs a physical
  # ARM64 phone, and the E2E rows need 0-of-32 slices implemented. A workflow that
  # requires hardware nobody has is a workflow that blocks every merge, and one
  # that waits on unimplemented features is a red cross nobody can clear. Both run
  # on demand; their results belong in `.forge/test-plan.md`, not in a failing job.